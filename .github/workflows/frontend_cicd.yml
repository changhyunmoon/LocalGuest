name: Frontend Blue-Green CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Create .env.production from Secrets
        working-directory: ./frontend
        run: |
          echo "${{ secrets.FE_ENV_PROD }}" > .env.production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.FRONTEND_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Deployment
        run: |
          mkdir -p frontend/deployment
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> frontend/deployment/.env
          echo "FRONTEND_IMAGE_NAME=${{ secrets.FRONTEND_IMAGE_NAME }}" >> frontend/deployment/.env
          echo "FRONTEND_IMAGE_TAG=${{ github.sha }}" >> frontend/deployment/.env

      # Git의 frontend/deployment 폴더 내용을 EC2로 전송
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/deployment/**"
          target: "/home/ubuntu/frontend-deploy"
          strip_components: 2
          overwrite: true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 백엔드와 동일하게 envs로 변수 전달
          envs: FRONTEND_IMAGE_TAG, DOCKERHUB_USERNAME, FRONTEND_IMAGE_NAME
          script: |
            export FRONTEND_IMAGE_TAG=${{ github.sha }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export FRONTEND_IMAGE_NAME=${{ secrets.FRONTEND_IMAGE_NAME }}
            
            cd /home/ubuntu/frontend-deploy
            
            # 전송된 파일 구조 정리 (deploy.sh가 기대하는 docker 폴더 위치 보정)
            mkdir -p docker
            [ -f docker-compose.yml ] && mv docker-compose.yml docker/
            
            # 실행 권한 부여 및 실행
            chmod +x deploy.sh
            ./deploy.sh
