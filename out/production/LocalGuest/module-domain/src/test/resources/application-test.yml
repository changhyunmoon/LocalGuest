spring:
  datasource:
    # 메모리 내에서만 작동하는 DB 주소입니다. (보안 위험 0%)
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 테스트 실행 시마다 테이블을 새로 만들고 삭제합니다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # H2에서도 MySQL 문법을 어느 정도 인식하게 해줍니다.
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: team6-local-guest-jwt-auth-secret-key-1234-long-String