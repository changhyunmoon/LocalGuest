spring:
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# OAuth2 성공 후 토큰을 넘겨받는 프론트 기준 URL ( …/oauth2/callback?token= ).
# prod 기본: 배포 HTTPS API/프론트가 https://api.bam-match.com 인 경우.
# 정적/SPA가 bam-match.com에만 뜨면 APP_OAUTH2_FRONTEND_REDIRECT_BASE=https://bam-match.com
app:
  oauth2:
    frontend-redirect-base: http://localhost:5173

# OpenAI(Spring AI) — 기본 비활성. 켤 때는 API 키(spring.ai.openai.api-key 등)가 필요하다.
# Gemini(Google AI Studio API 키) — module-gemini. llm-provider=gemini 일 때 localguest.gemini.enabled 필요.
localguest:
  openai:
    enabled: false
    model: gpt-4o-mini
  gemini:
    enabled: false
    model: gemini-2.0-flash
  ai:
    # LLM 프롬프트 추출(LlmPromptExtractor 빈 + 백엔드 활성 시). 스텁 단계에서는 false 권장.
    llm-prompt-extraction-enabled: false
    # openai(기본) | gemini — 각각 localguest.openai.enabled / localguest.gemini.enabled 와 함께 켠다.
    llm-provider: openai
    # LLM 경로에만 적용. 0 이하이면 제한 없음.
    llm-prompt-max-chars: 6000

---
spring:
  config:
    activate:
      on-profile: prod

app:
  oauth2:
    frontend-redirect-base: https://api.bam-match.com