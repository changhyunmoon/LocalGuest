spring:
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# OpenAI(Spring AI) — api-server의 LLM 경로는 module-openai만 사용한다. 켤 때는 API 키가 필요하다.
# (module-gemini는 레포에 남을 수 있으나 api-server 의존성에는 포함하지 않는다.)
localguest:
  openai:
    enabled: false
    model: gpt-4o-mini
  ai:
    # LLM 프롬프트 추출(LlmPromptExtractor 빈 + 백엔드 활성 시). 스텁 단계에서는 false 권장.
    llm-prompt-extraction-enabled: false
    # 후보 풀 LLM 재순위(기본 false). true 시 module-openai + ChatModel 필요.
    llm-rank-enabled: false
    # api-server에서는 openai만 지원한다.
    llm-provider: openai
    # LLM 경로에만 적용. 0 이하이면 제한 없음.
    llm-prompt-max-chars: 6000

---
spring:
  config:
    activate:
      on-profile: prod