spring:
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# OpenAI(Spring AI) — 기본 비활성. 켤 때는 API 키(spring.ai.openai.api-key 등)가 필요하다.
localguest:
  openai:
    enabled: false
    model: gpt-4o-mini
  ai:
    # LLM 프롬프트 추출(LlmPromptExtractor 빈 + OpenAI 활성 시). 스텁 단계에서는 false 권장.
    llm-prompt-extraction-enabled: false

---
spring:
  config:
    activate:
      on-profile: prod