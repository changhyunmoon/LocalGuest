<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LocalGuide - 실시간 채팅</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f0f2f5; --white: #ffffff; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }

        /* 사이드바 (목록) */
        #sidebar { width: 360px; background: var(--white); border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #eee; font-size: 1.3rem; font-weight: 800; color: #333; }
        #room-list { flex: 1; overflow-y: auto; }

        .room-item { padding: 18px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: 0.2s; position: relative; }
        .room-item:hover { background: #f8f9fa; }
        .room-item.active { background: #eef7ff; border-right: 4px solid var(--primary); }

        .room-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .room-title { font-weight: 700; color: #222; font-size: 16px; display: flex; align-items: center; gap: 6px; }
        .participant-count { font-size: 13px; color: #007bff; font-weight: 500; }
        .last-time { font-size: 11px; color: #999; }

        .room-info-bottom { display: flex; justify-content: space-between; align-items: center; }
        .last-msg { font-size: 14px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .unread-badge { background: #ff4d4f; color: white; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 12px; }

        /* 채팅 메인창 */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--white); }
        #chat-header { padding: 18px 25px; border-bottom: 1px solid #eee; font-weight: 700; font-size: 18px; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; background: #f8f9fa; display: flex; flex-direction: column; }
        #loading-bar { text-align: center; font-size: 12px; color: #aaa; padding: 10px; display: none; }

        /* 말풍선 */
        .msg-wrapper { margin-bottom: 15px; display: flex; flex-direction: column; }
        .msg-box { max-width: 70%; padding: 11px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .others { align-self: flex-start; background: var(--white); border: 1px solid #e0e0e0; border-top-left-radius: 2px; }
        .mine { align-self: flex-end; background: var(--primary); color: var(--white); border-top-right-radius: 2px; }
        .sender { font-size: 12px; color: #777; margin-bottom: 5px; font-weight: 500; }

        /* 하단 입력창 */
        #input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 12px; background: white; }
        #message-input { flex: 1; padding: 13px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-size: 14px; }
        #send-btn { padding: 0 25px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        #send-btn:hover { background: #0056b3; }

        #empty-view { flex: 1; display: flex; justify-content: center; align-items: center; color: #bbb; flex-direction: column; font-size: 15px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">채팅</div>
    <div id="room-list"></div>
</div>

<div id="chat-main">
    <div id="empty-view">
        <p>대화할 채팅방을 선택해 주세요.</p>
    </div>

    <div id="chat-window" style="display: none; flex-direction: column; height: 100%;">
        <div id="chat-header"><span id="header-title"></span></div>
        <div id="messages">
            <div id="loading-bar">이전 대화 로딩 중...</div>
        </div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.keyCode==13) sendMessage()">
            <button id="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>
</div>

<script>
    const MY_ID = 1; // 실제 환경에선 세션이나 토큰에서 가져옴
    const MY_NICK = "민지";
    let stompClient = null;
    let currentRoomId = null;
    let currentPage = 0;
    const PAGE_SIZE = 15;
    let isLoading = false;
    let hasMore = true;

    window.onload = loadRooms;

    // 1. 참여 중인 채팅방 목록 로드 (안 읽은 순 + 시간 순 정렬은 서버 Service 담당)
    async function loadRooms() {
        try {
            const res = await fetch(`/api/chat/rooms?userId=${MY_ID}`);
            const rooms = await res.json();
            const listDiv = document.getElementById('room-list');
            listDiv.innerHTML = '';

            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = `room-item ${room.roomId === currentRoomId ? 'active' : ''}`;
                div.onclick = () => selectRoom(room.roomId, room.title);

                div.innerHTML = `
                    <div class="room-info-top">
                        <span class="room-title">${room.title} <span class="participant-count">${room.participantCount}</span></span>
                        <span class="last-time">${formatTime(room.lastMessageAt)}</span>
                    </div>
                    <div class="room-info-bottom">
                        <span class="last-msg">${room.lastMessage || '새 대화를 시작해보세요!'}</span>
                        ${room.unreadCount > 0 ? `<span class="unread-badge">${room.unreadCount}</span>` : ''}
                    </div>
                `;
                listDiv.appendChild(div);
            });
        } catch (e) { console.error("목록 로드 중 에러:", e); }
    }

    // 2. 채팅방 선택 및 입장 (enterRoom 호출)
    async function selectRoom(roomId, title) {
        if (currentRoomId === roomId) return;

        // 초기화
        if (stompClient) stompClient.disconnect();
        currentRoomId = roomId;
        currentPage = 0;
        hasMore = true;

        document.getElementById('empty-view').style.display = 'none';
        document.getElementById('chat-window').style.display = 'flex';
        document.getElementById('messages').innerHTML = '<div id="loading-bar">이전 대화 로딩 중...</div>';

        try {
            // [핵심] 서버의 enterRoom API 호출 (읽음 처리 및 방 정보 갱신)
            const res = await fetch(`/api/chat/rooms/${roomId}/enter?userId=${MY_ID}`);
            const roomInfo = await res.json();
            document.getElementById('header-title').innerText = roomInfo.title;

            // 사이드바 동기화 (숫자 지우기)
            loadRooms();

            // 과거 이력 로드
            await loadMoreMessages();
            const msgDiv = document.getElementById('messages');
            msgDiv.scrollTop = msgDiv.scrollHeight;

            // 무한 스크롤 등록
            msgDiv.onscroll = () => {
                if (msgDiv.scrollTop === 0 && !isLoading && hasMore) loadMoreMessages();
            };

            // WebSocket 연결
            connectWebSocket(roomId);
        } catch (e) { console.error("방 입장 실패:", e); }
    }

    // 3. WebSocket 연결 및 구독
    function connectWebSocket(roomId) {
        const socket = new SockJS('/api/ws-stomp');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // 로그 숨기기
        stompClient.connect({}, () => {
            stompClient.subscribe(`/sub/chat/room/${roomId}`, (res) => {
                const chat = JSON.parse(res.body);

                // 현재 열린 방 메시지면 화면에 표시
                if (chat.roomId === currentRoomId) {
                    displayMessage(chat, false);
                    // 실시간 읽음 처리 신호 전송
                    stompClient.send("/pub/chat/read", {}, JSON.stringify({ roomId, userId: MY_ID }));
                }

                // 메시지 수신 시 목록 재정렬
                loadRooms();
            });
        });
    }

    // 4. 무한 스크롤 메시지 로드
    async function loadMoreMessages() {
        if (isLoading || !hasMore) return;
        isLoading = true;
        document.getElementById('loading-bar').style.display = 'block';

        const msgDiv = document.getElementById('messages');
        const prevHeight = msgDiv.scrollHeight;

        try {
            const res = await fetch(`/api/chat/rooms/${currentRoomId}/messages?page=${currentPage}&size=${PAGE_SIZE}`);
            const messages = await res.json();

            if (messages.length < PAGE_SIZE) hasMore = false;
            if (messages.length > 0) {
                // MongoDB 최신순을 화면에선 과거순으로 역정렬
                messages.reverse().forEach(msg => displayMessage(msg, true));
                currentPage++;
                msgDiv.scrollTop = msgDiv.scrollHeight - prevHeight;
            }
        } finally {
            isLoading = false;
            document.getElementById('loading-bar').style.display = 'none';
        }
    }

    function displayMessage(chat, isPrepend) {
        const container = document.getElementById('messages');
        const isMine = chat.senderId == MY_ID;
        const div = document.createElement('div');
        div.className = "msg-wrapper";
        div.innerHTML = `
            ${!isMine ? `<div class="sender">${chat.senderNickname}</div>` : ''}
            <div class="msg-box ${isMine ? 'mine' : 'others'}">${chat.message}</div>
        `;
        if (isPrepend) document.getElementById('loading-bar').after(div);
        else {
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (!input.value || !stompClient) return;
        const payload = { roomId: currentRoomId, senderId: MY_ID, senderNickname: MY_NICK, message: input.value };
        stompClient.send("/pub/chat/message", {}, JSON.stringify(payload));
        input.value = '';
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const isToday = date.toDateString() === now.toDateString();
        return isToday ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })
            : (date.getMonth()+1) + '월 ' + date.getDate() + '일';
    }
</script>
</body>
</html>
