# ---------------------------------------------------------------------------
# AI 추천(localguest.ai) 예시 — application-local.yml 등에 병합해 사용한다.
# - 응답 policyVersion / Micrometer / DB 후보 풀 캐시 접두는 모두
#   AiRecommendationTuning.POLICY_VERSION 문자열로 맞춘다(코드 상수).
# - 후보 풀(candidate-pool)은 조회·샘플링·제외 ID·TTL; 스코어·다양성과는 다른 축이지만
#   같은 배포에서 함께 튜닝하는 것을 권장한다.
# - 스코어·다양성 YAML만 바꿔 랭킹 의미가 달라지면 POLICY_VERSION을 올려 캐시·지표·API를 정합시킨다.
# ---------------------------------------------------------------------------
localguest:
  ai:
    # 아래는 “키 예시”. 비우거나 생략 시 코드 기본값.
    candidate-pool:
      max-pool-size: 80
      max-fetch-size: 200
      cold-start-reserve-ratio: 0.12
      pool-cache-ttl-seconds: 45
      excluded-guide-ids: []
    scoring-policy:
      low-signal-score-threshold: 15
      fallback-min-improvement-over-base: 4
    diversity-rerank:
      diversity-lambda: 15.0
