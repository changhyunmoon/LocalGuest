<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 채팅 테스트</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: #b2c7da; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #424242; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .back-btn { cursor: pointer; color: white; text-decoration: none; font-size: 0.9em; }

        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        #loader { text-align: center; padding: 10px; color: #555; font-size: 0.8em; display: none; }

        .msg-box { margin-bottom: 15px; display: flex; flex-direction: column; max-width: 80%; }
        .msg-box.mine { align-self: flex-end; align-items: flex-end; }
        .msg-box.others { align-self: flex-start; align-items: flex-start; }

        .nickname { font-size: 0.75em; color: #444; margin-bottom: 3px; font-weight: bold; }
        .bubble { padding: 8px 12px; border-radius: 12px; font-size: 0.95em; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .mine .bubble { background-color: #fee500; color: #000; border-top-right-radius: 2px; }
        .others .bubble { background-color: #ffffff; color: #000; border-top-left-radius: 2px; }

        .time { font-size: 0.7em; color: #666; margin-top: 4px; }

        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .send-btn { background: #fee500; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <a href="chatroomlist.html" class="back-btn">← 목록</a>
    <div id="room-title">채팅방 로딩 중...</div>
    <div id="status" style="font-size: 0.7em; color: #00ff00;">연결 중...</div>
</div>

<div id="chat-window">
    <div id="loader">이전 대화 불러오는 중...</div>
    <div id="message-list"></div>
</div>

<div class="input-bar">
    <input type="text" id="chat-input" placeholder="메시지를 입력하세요" onkeypress="if(event.keyCode==13) sendMessage()">
    <button class="send-btn" onclick="sendMessage()">전송</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    const myId = 1; // 테스트용 임시 ID
    const myNickname = "창현"; // 테스트용 닉네임

    let stompClient = null;
    let cursor = null;
    let hasNext = true;
    let isLoading = false;

    const chatWindow = document.getElementById('chat-window');
    const messageList = document.getElementById('message-list');
    const loader = document.getElementById('loader');

    // 1. 과거 메시지 페이징 로드 (HTTP)
    async function loadHistory() {
        if (!roomId || !hasNext || isLoading) return;
        isLoading = true;
        loader.style.display = 'block';
        const currentScrollHeight = chatWindow.scrollHeight;

        try {
            const response = await fetch(`/api/chat/rooms/${roomId}/messages` + (cursor ? `?cursor=${cursor}` : ''));
            const data = await response.json();

            cursor = data.nextCursor;
            hasNext = data.hasNext;

            data.messages.forEach(msg => {
                messageList.prepend(createMessageHtml(msg));
            });

            if (!data.nextCursor) {
                chatWindow.scrollTop = chatWindow.scrollHeight;
            } else {
                chatWindow.scrollTop = chatWindow.scrollHeight - currentScrollHeight;
            }
        } catch (e) { console.error(e); }
        finally { isLoading = false; loader.style.display = 'none'; }
    }

    // 2. WebSocket 연결 및 구독 (STOMP)
    function connect() {
        const socket = new SockJS('/api/ws-stomp');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = "온라인";

            // Redis 토픽을 경유해 오는 메시지 구독
            stompClient.subscribe(`/sub/chat/room/${roomId}`, function (response) {
                const msg = JSON.parse(response.body);
                appendMessage(msg);
            });
        }, function (error) {
            document.getElementById('status').innerText = "연결 끊김";
            document.getElementById('status').style.color = "red";
        });
    }

    // 3. 메시지 전송 (Publish)
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const content = input.value.trim();
        if (!content || !stompClient) return;

        const payload = {
            roomId: roomId,
            senderId: myId,
            senderNickname: myNickname,
            message: content
        };

        // 서버의 @MessageMapping("/chat/message")로 전송
        stompClient.send("/pub/chat/message", {}, JSON.stringify(payload));
        input.value = '';
    }

    // 4. 새 메시지 화면 하단에 추가
    function appendMessage(msg) {
        const msgHtml = createMessageHtml(msg);
        messageList.appendChild(msgHtml);
        chatWindow.scrollTop = chatWindow.scrollHeight; // 새 메시지 오면 바닥으로
    }

    function createMessageHtml(msg) {
        const isMine = msg.senderId === myId;
        const div = document.createElement('div');
        div.className = `msg-box ${isMine ? 'mine' : 'others'}`;
        const time = new Date(msg.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `
            ${!isMine ? `<div class="nickname">${msg.senderNickname}</div>` : ''}
            <div class="bubble">${msg.message}</div>
            <div class="time">${time}</div>
        `;
        return div;
    }

    // 스크롤 이벤트 (무한 스크롤)
    chatWindow.addEventListener('scroll', () => {
        if (chatWindow.scrollTop === 0 && hasNext && !isLoading) loadHistory();
    });

    // 초기 실행
    document.addEventListener('DOMContentLoaded', () => {
        if (!roomId) return alert("방 ID가 없습니다.");
        document.getElementById('room-title').innerText = `방 ID: ${roomId.substring(0,8)}...`;
        loadHistory();
        connect();
    });
</script>
</body>
</html>
