version: '3.8'

services:
  # Redis: 채팅 실시간 상태 관리 및 캐싱용
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - team6-backend
    restart: always

  # MongoDB: 채팅 메시지 및 로그 저장용
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./mongo/data:/data/db
    networks:
      - team6-backend
    restart: always

networks:
  team6-backend:
    external: true